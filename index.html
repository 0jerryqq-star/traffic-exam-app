<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>路口駕訓班</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --panel:#f7f7f2; --ink:#17191c; --muted:#58606a; --line:rgba(0,0,0,.14);
  --scrim:rgba(20,30,22,.52); --shadow:0 14px 40px rgba(0,0,0,.28);
  --sign:#0e6b47; --warn:#ffc72c; --warn-edge:#a57a00; --bad:#d52b1e; --good:#1c8f52; --blue:#1f5fbf;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#1a1e24; --ink:#eeebe3; --muted:#9ea7b2; --line:rgba(255,255,255,.14);
    --scrim:rgba(6,10,8,.66); --shadow:0 14px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --panel:#1a1e24; --ink:#eeebe3; --muted:#9ea7b2; --line:rgba(255,255,255,.14);
  --scrim:rgba(6,10,8,.66); --shadow:0 14px 40px rgba(0,0,0,.55);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#4f7f3d;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:var(--scrim);overflow:auto}
.screen.show{display:flex}
.stack{width:100%;max-width:520px;display:flex;flex-direction:column;gap:18px;margin:auto}

.board{background:var(--sign);color:#fff;border:4px solid #fff;outline:3px solid var(--sign);border-radius:16px;
  padding:22px 26px 20px;box-shadow:var(--shadow);position:relative}
.board .route{position:absolute;top:-16px;left:22px;background:var(--warn);color:#111;font-weight:900;
  border-radius:8px;padding:2px 10px;font-size:14px;border:2px solid #111}
.board h1{font-weight:900;font-size:clamp(46px,12vw,78px);line-height:1.02;margin:6px 0 10px;letter-spacing:.04em}
.board p{margin:0;font-weight:500;opacity:.92;line-height:1.55}
.board .arrow{position:absolute;right:22px;top:22px;font-size:44px;line-height:1;font-weight:900}

.menu{display:flex;flex-direction:column;gap:12px}
.btn{appearance:none;border:0;border-radius:12px;font:inherit;font-weight:900;font-size:20px;padding:14px 20px;cursor:pointer;
  background:var(--warn);color:#111;box-shadow:0 5px 0 var(--warn-edge);text-align:left;display:flex;justify-content:space-between;align-items:center}
.btn small{font-weight:500;font-size:13px;opacity:.7}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--warn-edge)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.plain{background:var(--panel);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.red{background:var(--bad);color:#fff;box-shadow:0 5px 0 #7c160f}
.btn.center{justify-content:center;text-align:center}
.keys{color:#fff;font-size:13px;line-height:1.7;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.keys kbd{font-family:inherit;background:rgba(255,255,255,.18);border-radius:5px;padding:0 6px;font-weight:700}

.card{background:var(--panel);color:var(--ink);border-radius:18px;padding:22px;box-shadow:var(--shadow);width:100%}
.card h2{margin:0 0 4px;font-size:28px;font-weight:900}
.card .chap{color:var(--muted);font-size:14px;font-weight:700}
.card p{line-height:1.6;margin:10px 0}
.card ul{margin:8px 0 0;padding-left:20px;line-height:1.7}
.card .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.card .row .btn{flex:1 1 140px}
.lvid{font-family:"Chakra Petch","Noto Sans TC",sans-serif;font-weight:700;background:var(--warn);color:#111;border-radius:8px;padding:0 10px;border:2px solid #111;margin-right:8px;font-size:22px}

.levels{max-width:720px}
.chapter h3{color:#fff;margin:6px 0 10px;font-size:18px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.lv{appearance:none;border:0;font:inherit;cursor:pointer;text-align:left;border-radius:14px;padding:12px 14px 14px;color:#fff;position:relative;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.lv:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.lv:focus-visible{outline:3px solid #fff;outline-offset:3px}
.lv.c1{background:var(--blue)} .lv.c2{background:var(--bad)} .lv.c3{background:var(--warn);color:#111}
.lv b{display:block;font-family:"Chakra Petch",sans-serif;font-size:26px;line-height:1.1}
.lv span{font-weight:700;font-size:15px}
.lv .done{position:absolute;right:10px;top:8px;background:#fff;color:var(--good);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-weight:900}

.result h2{font-size:34px}
.result.win h2{color:var(--good)} .result.fail h2{color:var(--bad)}
.reason{background:rgba(213,43,30,.1);border-left:5px solid var(--bad);border-radius:8px;padding:12px 14px;font-weight:700;line-height:1.6}
.result.win .reason{background:rgba(28,143,82,.12);border-color:var(--good)}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.veh{appearance:none;border:3px solid transparent;font:inherit;cursor:pointer;text-align:left;border-radius:16px;padding:12px 14px 14px;background:var(--panel);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.3);position:relative}
.veh:focus-visible{outline:3px solid #fff;outline-offset:3px}
.veh.sel{border-color:var(--warn)}
.veh canvas{width:100%;height:64px;display:block;background:#3c4046;border-radius:10px;margin-bottom:10px}
.veh h4{margin:0;font-size:20px;font-weight:900}
.veh p{margin:4px 0 8px;font-size:13px;color:var(--muted);line-height:1.5}
.veh dl{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;margin:0;font-size:13px;align-items:center}
.veh dt{font-weight:700}
.veh dd{margin:0;font-family:"Chakra Petch","Noto Sans TC",sans-serif;font-weight:700;text-align:right}
.veh .bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.veh .bar i{display:block;height:100%;background:var(--sign);border-radius:4px}
.veh .tick{position:absolute;right:12px;top:12px;background:var(--warn);color:#111;font-weight:900;border-radius:8px;padding:0 8px;font-size:13px;border:2px solid #111}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.hud-top{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:10px;align-items:flex-start}
.goalbox{background:rgba(14,18,22,.8);color:#fff;border-radius:12px;padding:8px 12px;max-width:min(560px,74vw)}
.goalbox .t{font-weight:900;font-size:16px}
.goalbox .t .lvid{font-size:15px;padding:0 6px;border-width:1.5px}
#hGoal{font-size:13px;color:#cfd7df;margin-top:4px;line-height:1.5}
#btnPause{pointer-events:auto;margin-left:auto;appearance:none;border:0;background:rgba(14,18,22,.8);color:#fff;border-radius:12px;width:46px;height:46px;font-size:18px;font-weight:900;cursor:pointer}
#btnPause:focus-visible{outline:3px solid var(--warn)}
.tl{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 66px);background:#15171a;border:3px solid #2e3238;border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:7px}
.tl i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:22px}
.tl .r{background:#3a1a18}.tl .y{background:#3a3218}.tl .g{background:#17331f}.tl .a{background:#17331f;color:#244a2e}
.tl .r.on{background:#ff3b2f;box-shadow:0 0 18px #ff3b2f}
.tl .y.on{background:#ffc31f;box-shadow:0 0 18px #ffc31f}
.tl .g.on{background:#2fe06b;box-shadow:0 0 18px #2fe06b}
.tl .a.on{background:#10240f;color:#3cff78;text-shadow:0 0 10px #3cff78}
.hud-bottom{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.speedo{background:rgba(14,18,22,.82);color:#fff;border-radius:12px;padding:6px 14px 8px;font-family:"Chakra Petch",sans-serif;text-align:center;min-width:96px}
#hSpd{font-size:36px;font-weight:700;display:block;line-height:1}
.speedo small{font-size:12px;opacity:.7}
.speedo.over{background:var(--bad)}
.sig{background:rgba(14,18,22,.82);border-radius:12px;padding:8px 12px;display:flex;gap:12px;font-size:24px;font-weight:900;color:#3b4046}
.sig .on{color:#ffb020;text-shadow:0 0 12px #ffb020}
#hInfo{background:rgba(14,18,22,.82);color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700;max-width:70vw}

/* ---------- touch ---------- */
.touch{display:none}
@media (hover:none) and (pointer:coarse){
  .touch{display:flex}
  .hud-bottom{bottom:calc(env(safe-area-inset-bottom,0px) + 104px)}
  .keys .kb{display:none}
}
.touch{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);justify-content:space-between;align-items:flex-end;padding:0 12px;z-index:11;pointer-events:none;gap:8px}
.touch .pad{display:flex;gap:8px;pointer-events:auto}
.touch button{appearance:none;border:0;width:72px;height:80px;border-radius:16px;background:rgba(14,18,22,.78);color:#fff;font:inherit;font-size:26px;font-weight:900;touch-action:none}
.touch button.act{background:rgba(255,199,44,.95);color:#111}
.touch .mid button{width:54px;height:54px;font-size:15px}
.touch .gas{background:#1c8f52}.touch .brk{background:#b3261b}
.touch button{font-size:18px}
@media (prefers-reduced-motion: reduce){.btn:active,.lv:active{transform:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="goalbox"><div class="t"><span class="lvid" id="hId">1-1</span><span id="hName"></span></div><div id="hGoal"></div></div>
    <button id="btnPause" aria-label="暫停">II</button>
  </div>
  <div class="tl hidden" id="tl"><i class="r"></i><i class="y"></i><i class="g"></i><i class="a hidden">←</i></div>
  <div class="hud-bottom">
    <div class="speedo" id="speedo"><span id="hSpd">0</span><small>km/h</small></div>
    <div class="sig"><span id="sigL">◀</span><span id="sigR">▶</span></div>
    <div id="hInfo"></div>
  </div>
</div>

<div id="touch" class="touch hidden">
  <div class="pad"><button data-k="left" aria-label="左轉向">◀</button><button data-k="right" aria-label="右轉向">▶</button></div>
  <div class="pad mid"><button data-sig="left" aria-label="左方向燈">⇦燈</button><button data-sig="right" aria-label="右方向燈">燈⇨</button></div>
  <div class="pad"><button data-k="down" class="brk">煞車</button><button data-k="up" class="gas">油門</button></div>
</div>

<!-- Main menu -->
<section class="screen show" id="scrMenu">
  <div class="stack">
    <div class="board">
      <span class="route">駕訓挑戰</span>
      <span class="arrow">↑</span>
      <h1>路口<br>駕訓班</h1>
      <p><span id="lvCount">12</span> 個小關卡：看懂號誌、打方向燈、禮讓行人、路邊停車，一關一關練到熟。</p>
    </div>
    <nav class="menu">
      <button class="btn" data-act="restart">重新開始 <small>從 1-1 開始</small></button>
      <button class="btn" data-act="levels">選擇關卡 <small id="progTxt"></small></button>
      <button class="btn" data-act="vehicles">選擇車輛 <small id="vehTxt"></small></button>
      <button class="btn red" data-act="quit">離開遊戲</button>
    </nav>
    <div class="keys"><span class="kb">操作：<kbd>↑</kbd>/<kbd>W</kbd> 油門　<kbd>↓</kbd>/<kbd>S</kbd> 煞車（停住後按住倒車）　<kbd>←</kbd><kbd>→</kbd> 轉向　<kbd>Q</kbd>/<kbd>E</kbd> 左／右方向燈　<kbd>Esc</kbd> 暫停</span></div>
  </div>
</section>

<!-- Level select -->
<section class="screen" id="scrLevels">
  <div class="stack levels">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <h2 style="color:#fff;margin:0;font-size:30px;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.5)">選擇關卡</h2>
      <button class="btn plain center" data-act="menu" style="font-size:16px;padding:10px 16px">回主選單</button>
    </div>
    <div id="lvList"></div>
  </div>
</section>

<!-- Vehicle select -->
<section class="screen" id="scrVehicles">
  <div class="stack levels">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <h2 style="color:#fff;margin:0;font-size:30px;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.5)">選擇車輛</h2>
      <button class="btn plain center" data-act="menu" style="font-size:16px;padding:10px 16px">回主選單</button>
    </div>
    <div class="vgrid" id="vehList"></div>
    <div class="keys">車越大越重：起步越慢、煞停距離越長、轉彎要繞越大圈。所有關卡都能用任何車輛挑戰。</div>
  </div>
</section>

<!-- Intro -->
<section class="screen" id="scrIntro">
  <div class="stack"><div class="card">
    <div class="chap" id="iChap"></div>
    <h2><span class="lvid" id="iId"></span><span id="iName"></span></h2>
    <p id="iGoal"></p>
    <div class="chap" id="iVeh"></div>
    <ul id="iRules"></ul>
    <div class="row">
      <button class="btn center" id="btnStart">開始駕駛</button>
      <button class="btn plain center" data-act="levels">選擇關卡</button>
    </div>
  </div></div>
</section>

<!-- Result -->
<section class="screen" id="scrResult">
  <div class="stack"><div class="card result" id="rCard">
    <div class="chap" id="rLv"></div>
    <h2 id="rTitle"></h2>
    <div class="reason" id="rMsg"></div>
    <div class="row" id="rBtns"></div>
  </div></div>
</section>

<!-- Pause -->
<section class="screen" id="scrPause">
  <div class="stack"><div class="card">
    <h2>暫停</h2>
    <div class="menu" style="margin-top:14px">
      <button class="btn" data-act="resume">繼續駕駛</button>
      <button class="btn plain" data-act="retry">重新開始本關</button>
      <button class="btn plain" data-act="levels">選擇關卡</button>
      <button class="btn plain" data-act="menu">回主選單</button>
    </div>
  </div></div>
</section>

<!-- Bye -->
<section class="screen" id="scrBye">
  <div class="stack"><div class="card" style="text-align:center">
    <h2>已離開遊戲</h2>
    <p>謝謝遊玩，開車記得打方向燈！現在可以直接關閉這個分頁。</p>
    <div class="row"><button class="btn center" data-act="menu">回到主選單</button></div>
  </div></div>
</section>

<script>
(()=>{
const $=s=>document.querySelector(s);
const cv=$('#game');let ctx=cv.getContext('2d');
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();};
}
let VW=0,VH=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);VW=window.innerWidth;VH=window.innerHeight;cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);}
addEventListener('resize',resize);resize();

/* ---------- constants & helpers ---------- */
const W=90,LANE=45,FIL=70,STOP_Y=120,WORLD=2600,BAYW=40,TAPER=40;
const ROAD='#3c4046',GRASS='#5b8c45',PAINT='#ecebe4',YEL='#f2c230';
const PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const KMH=v=>Math.abs(v)*0.36;           // 10 px = 1 m
const angDiff=(a,b)=>{let d=(a-b)%(2*PI);if(d>PI)d-=2*PI;if(d<-PI)d+=2*PI;return d;};
const CHAPTERS={1:'第一章　號誌路口',2:'第二章　道路規則',3:'第三章　進階挑戰與停車'};
const CAR_COLORS=['#e8e4da','#2b6cb0','#b83227','#3a3f47','#e0a526','#7b8794','#1c7c54','#8e44ad'];

const SKEY='drivingSchool.cleared.v1';
let cleared=new Set();
try{const s=localStorage.getItem(SKEY);if(s)cleared=new Set(JSON.parse(s));}catch(e){}
function saveProg(){try{localStorage.setItem(SKEY,JSON.stringify([...cleared]));}catch(e){}}
const VEHICLES=[
 {id:'sedan',name:'一般轎車',len:44,wid:22,wb:28,acc:135,brk:330,maxV:230,steer:0.62,color:'#f26a1b',desc:'輕巧靈活，起步快、煞得住，最適合新手。'},
 {id:'pickup',name:'小貨車',len:54,wid:24,wb:34,acc:108,brk:275,maxV:210,steer:0.63,color:'#2f7dd1',desc:'車身稍長，載著貨物，起步和煞車都慢一些。'},
 {id:'truck',name:'大貨車',len:82,wid:28,wb:50,acc:72,brk:205,maxV:185,steer:0.68,color:'#d8342a',desc:'又長又重，要提早煞車，轉彎要繞大一點。'},
 {id:'bus',name:'大客車',len:96,wid:28,wb:58,acc:62,brk:190,maxV:180,steer:0.7,color:'#1c8f52',desc:'車身最長，起步最慢、煞停距離最長，轉彎半徑最大。'},
];
const VKEY='drivingSchool.vehicle.v1';
let vehIdx=0;
try{const v=localStorage.getItem(VKEY);const i=VEHICLES.findIndex(x=>x.id===v);if(i>=0)vehIdx=i;}catch(e){}
function saveVeh(){try{localStorage.setItem(VKEY,VEHICLES[vehIdx].id);}catch(e){}}

function corners(o){const s=Math.sin(o.a),c=Math.cos(o.a),hl=o.len/2,hw=o.wid/2;
  return [[hl,hw],[hl,-hw],[-hl,-hw],[-hl,hw]].map(([f,r])=>({x:o.x+s*f+c*r,y:o.y-c*f+s*r}));}
function sat(A,B){const pa=corners(A),pb=corners(B);
  for(const p of [pa,pb])for(let i=0;i<2;i++){const ax={x:-(p[i+1].y-p[i].y),y:p[i+1].x-p[i].x};
    let a1=1e9,a2=-1e9,b1=1e9,b2=-1e9;
    for(const q of pa){const d=q.x*ax.x+q.y*ax.y;if(d<a1)a1=d;if(d>a2)a2=d;}
    for(const q of pb){const d=q.x*ax.x+q.y*ax.y;if(d<b1)b1=d;if(d>b2)b2=d;}
    if(a2<b1||b2<a1)return false;}
  return true;}
function inBay(b,x,y,m){
  if(!b||x<W-1)return false;
  if(y>=b.y0&&y<=b.y1)return x<=b.x1+m;
  if(y>b.y1&&y<=b.y1+TAPER)return x<=W+BAYW*(1-(y-b.y1)/TAPER)+m;
  if(y<b.y0&&y>=b.y0-TAPER)return x<=W+BAYW*(1-(b.y0-y)/TAPER)+m;
  return false;}
function onRoad(g,x,y,m){
  const map=g.L.map;
  if(inBay(g.bay,x,y,m))return true;
  if(map==='straight')return Math.abs(x)<=W+m&&Math.abs(y)<=WORLD;
  if(Math.abs(x)<=W+m&&Math.abs(y)<=WORLD)return true;
  if(Math.abs(y)<=W+m&&Math.abs(x)<=WORLD)return true;
  const ax=Math.abs(x),ay=Math.abs(y);
  if(ax<=W+FIL&&ay<=W+FIL){const dx=ax-(W+FIL),dy=ay-(W+FIL);if(dx*dx+dy*dy>=(FIL-m)*(FIL-m))return true;}
  return false;}

/* ---------- traffic streams ---------- */
function makeStream(o){return Object.assign({cars:[],t:0,pi:0,vmax:160,len:2*WORLD+200,sStop:null,canGo:()=>true,pattern:[2.2],msg:'發生碰撞！'},o);}
function stepStream(st,dt,g){
  st.t-=dt;
  if(st.t<=0){const last=st.cars[st.cars.length-1];
    if(!last||last.s>75){st.cars.push({s:0,v:st.vmax*0.9,color:CAR_COLORS[(Math.random()*CAR_COLORS.length)|0]});st.t=st.pattern[st.pi++%st.pattern.length];}
    else st.t=0.3;}
  const go=st.canGo(g);
  for(let i=0;i<st.cars.length;i++){const c=st.cars[i];let tgt=st.vmax;const f=c.s+22;
    if(!go&&st.sStop!=null&&f<=st.sStop+2)tgt=Math.min(tgt,Math.max(0,(st.sStop-3-f)*2.2));
    if(i>0){const gap=st.cars[i-1].s-c.s-44-14;tgt=Math.min(tgt,Math.max(0,gap*2.4));}
    if(st.follow&&g&&g.car){const p=g.car,lat=st.dx?(p.y-st.y0):(p.x-st.x0);
      if(Math.abs(lat)<24){const ps=(p.x-st.x0)*st.dx+(p.y-st.y0)*st.dy,gap=ps-c.s-p.len/2-22-12;if(gap>-10)tgt=Math.min(tgt,Math.max(0,gap*2.4));}}
    c.v+=clamp(tgt-c.v,-420*dt,140*dt);if(c.v<0)c.v=0;c.s+=c.v*dt;}
  while(st.cars.length&&st.cars[0].s>st.len)st.cars.shift();}
function streamObjs(st){return st.cars.map(c=>({x:st.x0+st.dx*c.s,y:st.y0+st.dy*c.s,a:st.a,len:44,wid:22,color:c.color,msg:st.msg,braking:c.v<st.vmax*0.6,kind:'car'}));}

function mkPed(x,y,vx,vy,color){return {x,y,vx,vy,color,ph:Math.random()*6};}
function movePeds(g,dt,msg){for(const p of g.peds){p.x+=p.vx*dt;p.y+=p.vy*dt;p.ph+=dt*9;g.obstacles.push({x:p.x,y:p.y,a:0,len:20,wid:20,msg,kind:'ped'});}}
const distM=g=>(g.fy-g.L.stopLineY)/10;

/* ---------- levels ---------- */
const LEVELS=[

 setup(g){g.rail={state:'idle',t:0,arm:0,trainX:null};},

   if(r.state==='idle'&&g.car.y<600){r.state='alarm';r.t=0;}
   if(r.state==='alarm'){r.arm=Math.min(1,r.arm+dt/2);if(r.t>2.2&&r.trainX==null)r.trainX=-1700;}
   if(r.trainX!=null){r.trainX+=520*dt;if(r.state==='alarm'&&r.trainX-560>W+40){r.state='clear';r.t=0;}if(r.trainX-560>WORLD)r.trainX=null;}
   if(r.state==='clear'&&r.t>1){r.arm=Math.max(0,r.arm-dt/2);if(r.arm===0)r.state='done';}
   g.alarm=r.state==='alarm'||r.state==='clear';
   if(!g.crossed&&g.stopT>1&&g.fy>=95&&g.fy<=195)g.didStop=true;
   if(r.trainX!=null)g.obstacles.push({x:r.trainX-280,y:0,a:PI/2,len:560,wid:36,msg:'被火車撞上了！警鈴響時絕對不可以穿越平交道。'});
   if(r.arm>0.6)g.obstacles.push({x:55,y:45,a:PI/2,len:90,wid:6,msg:'撞上平交道柵欄了！'});},
 onStopLine(g){
   if(g.alarm)return g.fail('平交道警鈴正在響、柵欄放下，禁止穿越！');

/* ---------- player car ---------- */
function makeCar(x,y,a,sp){return {x,y,a,v:0,steer:0,len:sp.len,wid:sp.wid,color:sp.color,type:sp.id,spec:sp,signal:null,sigA0:0,braking:false,hold:0,player:true};}
function updateCar(c,dt,inp){
  const sp=c.spec,MAXV=sp.maxV,ACC=sp.acc,BRK=sp.brk,DRAG=24,REV=-60;
  c.braking=false;
  if(inp.down){
    if(c.v>0){c.v=Math.max(0,c.v-BRK*dt);c.braking=true;c.hold=0;}
    else{c.hold+=dt;c.braking=true;if(c.hold>0.45)c.v=Math.max(REV,c.v-ACC*0.6*dt);}
  }else c.hold=0;
  if(inp.up){if(c.v<0)c.v=Math.min(0,c.v+BRK*dt);else c.v=Math.min(MAXV,c.v+ACC*(1-c.v/(MAXV*1.15))*dt);}
  if(!inp.up&&!inp.down){const d=DRAG*dt;c.v=Math.abs(c.v)<=d?0:c.v-Math.sign(c.v)*d;}
  const maxS=sp.steer/(1+Math.abs(c.v)/260);
  const tgt=((inp.right?1:0)-(inp.left?1:0))*maxS;
  c.steer+=clamp(tgt-c.steer,-3.2*dt,3.2*dt);
  c.a+=c.v/sp.wb*Math.tan(c.steer)*dt;
  c.x+=Math.sin(c.a)*c.v*dt;c.y-=Math.cos(c.a)*c.v*dt;
}

/* ---------- game state ---------- */
let G=null,cur=0,mode='menu';
const cam={x:0,y:0};
function newGame(i){
  const L=LEVELS[i];
  const g={L,t:0,car:makeCar(L.start.x,L.start.y,0,VEHICLES[vehIdx]),moved:false,stopT:0,crossed:false,inBox:false,exited:null,over:false,
    obstacles:[],streams:[],peds:[],light:null,fy:0,msg:''};
  g.fail=m=>{if(g.over)return;g.over='fail';g.msg=m;endLevel(g);};
  g.win=m=>{if(g.over)return;g.over='win';g.msg=typeof m==='function'?m(g):m;endLevel(g);};
  L.setup&&L.setup(g);
  g.streams.forEach(st=>{for(let k=0;k<1200;k++)stepStream(st,1/60,g);});
  g.fy=g.car.y-22;
  cam.x=g.car.x;cam.y=g.car.y-150;
  return g;
}
function step(g,dt){
  const L=g.L,c=g.car;g.t+=dt;
  updateCar(c,dt,{up:keyOn('up'),down:keyOn('down'),left:keyOn('left'),right:keyOn('right')});
  if(Math.abs(c.v)>25)g.moved=true;
  g.stopT=Math.abs(c.v)<1.5?g.stopT+dt:0;
  if(c.signal&&Math.abs(angDiff(c.a,c.sigA0))>1.1&&Math.abs(c.steer)<0.08)c.signal=null; // auto-cancel after a turn
  if(g.sigCancel>0){g.sigCancel-=dt;if(g.sigCancel<=0){if(Math.abs(c.steer)<0.05)c.signal=null;else g.sigCancel=0.1;}}
  const cs=corners(c);g.fy=Math.min(cs[0].y,cs[1].y,cs[2].y,cs[3].y);
  g.obstacles.length=0;
  for(const st of g.streams){stepStream(st,dt,g);g.obstacles.push(...streamObjs(st));}
  L.update&&L.update(g,dt);if(g.over)return;
  if(L.stopLineY!=null&&!g.crossed&&g.fy<L.stopLineY&&c.x>-W){g.crossed=true;L.onStopLine&&L.onStopLine(g);if(g.over)return;}
  if(L.map==='cross'){
    const B=W+FIL-10,inBox=g.crossed&&Math.abs(c.x)<B&&Math.abs(c.y)<B;
    if(inBox)g.inBox=true;
    else if(g.inBox&&!g.exited){
      const d=c.y<-B?'straight':c.x<-B?'left':c.x>B?'right':'back';g.exited=d;
      if(L.exitDir&&d!==L.exitDir)return g.fail(L.wrongExit?L.wrongExit(d):'沒有依指示方向行駛。');}
  }
  for(const o of g.obstacles)if(sat(c,o))return g.fail(o.msg);
  for(const p of cs)if(!onRoad(g,p.x,p.y,4))return g.fail('車子開出道路了（壓上路緣或草地）。');
  // wrong-way check
  const dx=Math.sin(c.a),dy=-Math.cos(c.a);
  const nearBox=L.map==='cross'&&Math.abs(c.x)<W+FIL+10&&Math.abs(c.y)<W+FIL+10;
  if(!nearBox){
    let wrong=false;
    if(Math.abs(c.x)<=W&&(L.map==='straight'||Math.abs(c.y)>W)){if((dy<-0.6&&c.x<-6)||(dy>0.6&&c.x>6))wrong=true;}
    else if(L.map==='cross'&&Math.abs(c.y)<=W){if((dx<-0.6&&c.y>6)||(dx>0.6&&c.y<-6))wrong=true;}
    if(wrong)return g.fail('逆向行駛！車子跨過中線開進對向車道。');
    // lane change detection (all levels)
    let seg=null,lat=0;
    if(Math.abs(c.x)<=W+BAYW+5&&(L.map==='straight'||Math.abs(c.y)>W+FIL+10)){seg='v';lat=Math.abs(c.x);}
    else if(L.map==='cross'&&Math.abs(c.y)<=W){seg='h';lat=Math.abs(c.y);}
    if(seg){
      if(g.laneSeg!==seg){g.laneSeg=seg;g.lane=lat>W?'bay':lat<LANE?'in':'out';}
      else{let nl=g.lane;
        if(lat>W+2)nl='bay';else if(lat<LANE-4)nl='in';else if(lat>LANE+4&&lat<=W)nl='out';
        if(nl!==g.lane){const prev=g.lane;g.lane=nl;
          if(prev!=='bay'&&nl!=='bay'){const need=nl==='in'?'left':'right';
            if(c.signal!==need)return g.fail(`變換車道時沒有打${need==='left'?'左轉方向燈（按 Q）':'右轉方向燈（按 E）'}。所有關卡換車道都必須先打方向燈。`);
            g.sigCancel=1.2;}}}
    }
  }else g.laneSeg=null;
  if(L.map==='cross'&&g.exited&&Math.max(Math.abs(c.x),Math.abs(c.y))>W+FIL+70)return g.win(L.winMsg||'過關！');
  if(L.finishY!=null&&c.y<L.finishY&&(!L.canFinish||L.canFinish(g)))return g.win(L.winMsg||'過關！');
}

/* ---------- drawing ---------- */
function hash(ix,iy){let n=Math.imul(ix,374761393)+Math.imul(iy,668265263);n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967295;}
function drawTrees(L,x0,x1,y0,y1){
  const T=120;
  for(let ix=Math.floor(x0/T)-1;ix<=Math.ceil(x1/T);ix++)for(let iy=Math.floor(y0/T)-1;iy<=Math.ceil(y1/T);iy++){
    const h=hash(ix,iy);if(h>0.55)continue;
    const x=ix*T+hash(ix+7,iy)*80,y=iy*T+hash(ix,iy+9)*80;
    if(Math.abs(x)<W+55)continue;
    if(L.map==='cross'&&Math.abs(y)<W+55)continue;
    if(L.rail&&Math.abs(y)<75)continue;
    const r=16+h*26;
    ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.arc(x+6,y+7,r,0,7);ctx.fill();
    ctx.fillStyle=h<0.2?'#2f6b35':'#3c7a3a';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.1)';ctx.beginPath();ctx.arc(x-r*0.3,y-r*0.3,r*0.5,0,7);ctx.fill();
  }
}
function laneArrow(x,y,type){
  ctx.save();ctx.strokeStyle=PAINT;ctx.fillStyle=PAINT;ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x,y+26);ctx.lineTo(x,y-10);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,y-22);ctx.lineTo(x-7,y-9);ctx.lineTo(x+7,y-9);ctx.fill();
  const s=type==='L'?-1:1;
  ctx.beginPath();ctx.moveTo(x,y+10);ctx.quadraticCurveTo(x,y,x+s*11,y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+s*20,y);ctx.lineTo(x+s*10,y-7);ctx.lineTo(x+s*10,y+7);ctx.fill();
  ctx.restore();
}
function zebra(y,h){ctx.fillStyle=PAINT;for(let x=-W+5;x<W-5;x+=15)ctx.fillRect(x,y,8,h);}

function drawRoads(L){

function finishLine(y){const s=15;for(let x=-W;x<W;x+=s)for(let r=0;r<2;r++){ctx.fillStyle=((x/s|0)+r)%2?'#111':'#fff';ctx.fillRect(x,y-r*s,s,s);}}

function post(x,y){ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.arc(x+4,y+5,16,0,7);ctx.fill();}
function signText(t,x,y,size,color){ctx.fillStyle=color;ctx.font=`900 ${size}px "Noto Sans TC","Chakra Petch",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y+1);}
function stopSignAt(x,y){post(x,y);ctx.save();ctx.translate(x,y);ctx.beginPath();for(let i=0;i<8;i++){const a=PI/8+i*PI/4;ctx.lineTo(Math.cos(a)*17,Math.sin(a)*17);}ctx.closePath();
  ctx.fillStyle='#fff';ctx.fill();ctx.beginPath();for(let i=0;i<8;i++){const a=PI/8+i*PI/4;ctx.lineTo(Math.cos(a)*14.5,Math.sin(a)*14.5);}ctx.closePath();ctx.fillStyle='#d52b1e';ctx.fill();ctx.restore();signText('停',x,y,16,'#fff');}
function limitSign(x,y,t){post(x,y);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,16,0,7);ctx.fill();ctx.strokeStyle='#d52b1e';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y,13.5,0,7);ctx.stroke();signText(t,x,y,13,'#111');}
function endSign(x,y){post(x,y);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,16,0,7);ctx.fill();ctx.strokeStyle='#777';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,14,0,7);ctx.stroke();signText('40',x,y,12,'#999');ctx.strokeStyle='#333';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-10,y+10);ctx.lineTo(x+10,y-10);ctx.stroke();}
function blueSign(x,y,t){post(x,y);ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(x-17,y-17,34,34,4);ctx.fill();ctx.fillStyle='#1f5fbf';ctx.beginPath();ctx.roundRect(x-15,y-15,30,30,3);ctx.fill();signText(t,x,y,10,'#fff');}
function warnSign(x,y,t){post(x,y);ctx.save();ctx.translate(x,y);ctx.fillStyle='#d52b1e';ctx.beginPath();ctx.moveTo(0,-19);ctx.lineTo(19,15);ctx.lineTo(-19,15);ctx.closePath();ctx.fill();ctx.fillStyle='#ffc72c';ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(13,11);ctx.lineTo(-13,11);ctx.closePath();ctx.fill();ctx.restore();signText(t,x,y+4,8,'#111');}

function drawSignalHead(g){
  const Lt=g.light;
  ctx.strokeStyle='#5a6068';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(128,-120);ctx.lineTo(20,-116);ctx.stroke();
  ctx.fillStyle='#4a4f56';ctx.beginPath();ctx.arc(128,-120,7,0,7);ctx.fill();
  const n=g.L.arrow?4:3;
  ctx.fillStyle='#121416';ctx.beginPath();ctx.roundRect(24,-126,14*n+6,20,4);ctx.fill();
  const lamps=[['#ff3b2f','#3a1a18',Lt.r],['#ffc31f','#3a3218',Lt.y],['#2fe06b','#17331f',Lt.g]];
  lamps.forEach(([on,off,v],i)=>{const x=34+i*14;if(v){ctx.fillStyle=on+'55';ctx.beginPath();ctx.arc(x,-116,11,0,7);ctx.fill();}ctx.fillStyle=v?on:off;ctx.beginPath();ctx.arc(x,-116,5.5,0,7);ctx.fill();});
  if(g.L.arrow){const x=34+3*14;ctx.fillStyle='#10200f';ctx.beginPath();ctx.arc(x,-116,5.5,0,7);ctx.fill();
    ctx.fillStyle=Lt.left?'#3cff78':'#23472b';ctx.beginPath();ctx.moveTo(x-4.5,-116);ctx.lineTo(x,-120);ctx.lineTo(x,-112);ctx.closePath();ctx.fill();ctx.fillRect(x-1,-117.2,5,2.4);}
}
function drawRail(){
  const X=WORLD;
  ctx.fillStyle='#6f685b';ctx.fillRect(-X,-34,2*X,68);
  ctx.fillStyle='#4c3b2c';for(let x=-X;x<X;x+=18){if(Math.abs(x)<W)continue;ctx.fillRect(x,-24,8,48);}
  ctx.fillStyle='#55595f';ctx.fillRect(-W,-30,2*W,60);
  ctx.fillStyle='#c3c7cd';ctx.fillRect(-X,-14,2*X,3);ctx.fillRect(-X,11,2*X,3);
}
function drawRailOver(g){
  const r=g.rail;
  const arm=(px,py,dir)=>{ // dir: +1 for right side barrier pointing west
    const ang=dir>0?PI-(1-r.arm)*PI/2:-(1-r.arm)*PI/2;const len=92;
    ctx.save();ctx.translate(px,py);ctx.rotate(ang);
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(3,-1,len,6);
    ctx.fillStyle='#fff';ctx.fillRect(0,-3,len,6);ctx.fillStyle='#d52b1e';for(let i=0;i<len;i+=16)ctx.fillRect(i+8,-3,8,6);
    ctx.restore();
    ctx.fillStyle='#333';ctx.beginPath();ctx.arc(px,py,7,0,7);ctx.fill();};
  arm(102,45,1);arm(-102,-45,-1);
  const flash=g.alarm&&((performance.now()/300|0)%2===0);
  for(const [x,y] of [[112,70],[-112,-70]]){
    post(x,y);ctx.fillStyle='#fff';ctx.save();ctx.translate(x,y);
    for(const a of [PI/4,-PI/4]){ctx.save();ctx.rotate(a);ctx.fillStyle='#fff';ctx.fillRect(-18,-4,36,8);ctx.strokeStyle='#d52b1e';ctx.lineWidth=1.5;ctx.strokeRect(-18,-4,36,8);ctx.restore();}
    ctx.restore();
    for(const s of [-1,1]){const on=g.alarm&&(flash===(s>0));ctx.fillStyle=on?'#ff2f24':'#4a1512';ctx.beginPath();ctx.arc(x+s*9,y+16,5,0,7);ctx.fill();
      if(on){ctx.fillStyle='rgba(255,47,36,.3)';ctx.beginPath();ctx.arc(x+s*9,y+16,14,0,7);ctx.fill();}}
  }
  if(r.trainX!=null){
    for(let k=0;k<4;k++){const x1=r.trainX-k*140,x0=x1-132;
      ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(x0+4,-15,132,36);
      ctx.fillStyle='#eef0ee';ctx.beginPath();ctx.roundRect(x0,-18,132,36,k===0?12:4);ctx.fill();
      ctx.fillStyle='#1f5fbf';ctx.fillRect(x0+4,-4,124,8);
      ctx.fillStyle='#ff8a1f';ctx.fillRect(x0+4,4,124,3);
      ctx.fillStyle='rgba(30,40,55,.8)';for(let w=x0+10;w<x1-14;w+=18)ctx.fillRect(w,-14,10,6);
      if(k===0){ctx.fillStyle='#223';ctx.fillRect(x1-14,-14,8,28);}
    }
  }
}

function blinkOn(){return (performance.now()/330|0)%2===0;}
function zoom(){return clamp(Math.min(VW,VH)/640,0.62,1.5);}
function updateCam(g,dt){const c=g.car;const look=110+Math.abs(c.v)*0.4;
  const tx=c.x+Math.sin(c.a)*look,ty=c.y-Math.cos(c.a)*look;const k=1-Math.exp(-dt*3);cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;}
function render(g){
  const L=g.L,z=zoom();
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=GRASS;ctx.fillRect(0,0,VW,VH);
  ctx.setTransform(DPR*z,0,0,DPR*z,DPR*(VW/2-cam.x*z),DPR*(VH/2-cam.y*z));
  const x0=cam.x-VW/2/z,x1=cam.x+VW/2/z,y0=cam.y-VH/2/z,y1=cam.y+VH/2/z;
  const T=80;ctx.fillStyle='rgba(255,255,255,.035)';
  for(let x=Math.floor(x0/T)*T;x<x1;x+=T)for(let y=Math.floor(y0/T)*T;y<y1;y+=T)if((((x/T)+(y/T))&1)===0)ctx.fillRect(x,y,T,T);
  drawTrees(L,x0,x1,y0,y1);
  drawRoads(L);
  L.drawUnder&&L.drawUnder(g);
  if(L.finishY!=null)finishLine(L.finishY);
  for(const st of g.streams)for(const o of streamObjs(st))drawCar(o);
  drawCar(g.car);
  for(const p of g.peds)drawPed(p);
  L.drawOver&&L.drawOver(g);
  if(L.stopSign)stopSignAt(112,150);
  if(g.light&&L.map==='cross')drawSignalHead(g);
}

/* ---------- HUD ---------- */
const hud={spd:$('#hSpd'),speedo:$('#speedo'),sigL:$('#sigL'),sigR:$('#sigR'),info:$('#hInfo'),tl:$('#tl'),
  lr:$('#tl .r'),ly:$('#tl .y'),lg:$('#tl .g'),la:$('#tl .a')};
function updateHud(g){
  const c=g.car,L=g.L,b=blinkOn();
  hud.spd.textContent=Math.round(KMH(c.v));
  hud.speedo.classList.toggle('over',!!(L.limit&&g.inZone&&KMH(c.v)>L.limit-2));
  hud.sigL.classList.toggle('on',c.signal==='left'&&b);hud.sigR.classList.toggle('on',c.signal==='right'&&b);
  if(g.light){hud.tl.classList.remove('hidden');hud.lr.classList.toggle('on',!!g.light.r);hud.ly.classList.toggle('on',!!g.light.y);hud.lg.classList.toggle('on',!!g.light.g);
    hud.la.classList.toggle('hidden',!L.arrow);hud.la.classList.toggle('on',!!g.light.left);}
  else hud.tl.classList.add('hidden');
  const s=[];
  if(L.stopLineY!=null&&!g.crossed)s.push(`距停止線 ${Math.max(0,distM(g)).toFixed(1)} m`);
  if(L.info){const t=L.info(g);if(t)s.push(t);}
  const txt=s.join('　');if(hud.info.textContent!==txt)hud.info.textContent=txt;
  hud.info.style.display=txt?'':'none';
}

/* ---------- input ---------- */
const keys={},touch={};
const keyOn=k=>!!(keys[k]||touch[k]);
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
function toggleSig(s){const c=G.car;c.signal=c.signal===s?null:s;c.sigA0=c.a;}
function clearInput(){for(const k in keys)keys[k]=false;for(const k in touch)touch[k]=false;document.querySelectorAll('.touch .act').forEach(b=>b.classList.remove('act'));}
addEventListener('keydown',e=>{
  const k=KEYMAP[e.code];if(k){keys[k]=true;if(mode==='play')e.preventDefault();}
  if(e.repeat)return;
  const onBtn=document.activeElement&&document.activeElement.tagName==='BUTTON';
  if(mode==='play'){
    if(e.code==='KeyQ')toggleSig('left');
    else if(e.code==='KeyE')toggleSig('right');
    else if(e.code==='Escape'||e.code==='KeyP')pause();
    else if(e.code==='KeyR')retry();
    if(e.code==='Space')e.preventDefault();
  }else if(mode==='pause'&&(e.code==='Escape'||e.code==='KeyP'))resume();
  else if(mode==='intro'&&(e.code==='Enter'||e.code==='Space')&&!onBtn){e.preventDefault();startPlay();}
  else if(mode==='result'&&e.code==='Enter'&&!onBtn){const p=$('#rBtns .btn');p&&p.click();}
});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)keys[k]=false;});
addEventListener('blur',clearInput);
document.querySelectorAll('.touch button').forEach(b=>{
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(mode!=='play')return;
    if(b.dataset.k){touch[b.dataset.k]=true;b.classList.add('act');try{b.setPointerCapture(e.pointerId);}catch(_){}}
    else if(b.dataset.sig)toggleSig(b.dataset.sig);});
  const up=()=>{if(b.dataset.k){touch[b.dataset.k]=false;b.classList.remove('act');}};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});

/* ---------- screens ---------- */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('show',s.id===id));
  const s=id&&document.getElementById(id);if(s){const f=s.querySelector('.btn,.lv');f&&f.focus({preventScroll:true});}}
function setMode(m){mode=m;$('#hud').classList.toggle('hidden',!(m==='play'||m==='ended'||m==='pause'));$('#touch').classList.toggle('hidden',m!=='play');if(m!=='play')clearInput();}
function progText(){$('#progTxt').textContent=`已過關 ${cleared.size}／${LEVELS.length}`;$('#vehTxt').textContent=`目前：${VEHICLES[vehIdx].name}`;$('#lvCount').textContent=LEVELS.length;}
function vStats(sp){let v=0,t=0;while(v<111.1&&t<30){v+=sp.acc*(1-v/(sp.maxV*1.15))*0.01;t+=0.01;}
  return {t0:t,bd:(111.1*111.1)/(2*sp.brk)/10,len:sp.len/10,top:Math.round(sp.maxV*0.36)};}
function drawPreview(cvs,sp){const w=cvs.clientWidth||200,h=64,d=Math.min(2,window.devicePixelRatio||1);cvs.width=w*d;cvs.height=h*d;
  const pc=cvs.getContext('2d'),old=ctx;ctx=pc;pc.setTransform(d,0,0,d,0,0);
  pc.fillStyle='#3c4046';pc.fillRect(0,0,w,h);pc.fillStyle=PAINT;for(let x=6;x<w;x+=28)pc.fillRect(x,h-7,14,2.5);
  const sc=Math.min(1.25,(w-24)/sp.len);pc.translate(w/2,h/2-3);pc.scale(sc,sc);
  drawCar({x:0,y:0,a:PI/2,len:sp.len,wid:sp.wid,type:sp.id,color:sp.color,player:true});ctx=old;}
function buildVehicles(){const box=$('#vehList');box.innerHTML='';
  const all=VEHICLES.map(vStats),maxT=Math.max(...all.map(a=>a.t0)),maxB=Math.max(...all.map(a=>a.bd)),maxL=Math.max(...all.map(a=>a.len));
  VEHICLES.forEach((sp,i)=>{const st=all[i];const b=document.createElement('button');b.className='veh'+(i===vehIdx?' sel':'');
    b.innerHTML=`${i===vehIdx?'<span class="tick">使用中</span>':''}<canvas></canvas><h4>${sp.name}</h4><p>${sp.desc}</p>
    <dl><dt>起步 0→40</dt><div class="bar"><i style="width:${(st.t0/maxT*100).toFixed(0)}%"></i></div><dd>${st.t0.toFixed(1)} 秒</dd>
    <dt>40 煞停距離</dt><div class="bar"><i style="width:${(st.bd/maxB*100).toFixed(0)}%;background:var(--bad)"></i></div><dd>${st.bd.toFixed(1)} m</dd>
    <dt>車長</dt><div class="bar"><i style="width:${(st.len/maxL*100).toFixed(0)}%;background:var(--blue)"></i></div><dd>${st.len.toFixed(1)} m</dd>
    <dt>最高時速</dt><div></div><dd>${st.top} km/h</dd></dl>`;
    b.onclick=()=>{vehIdx=i;saveVeh();G=newGame(cur);buildVehicles();progText();const nb=$('#vehList').children[i];nb&&nb.focus({preventScroll:true});};
    box.appendChild(b);});
  requestAnimationFrame(()=>[...box.children].forEach((b,i)=>drawPreview(b.querySelector('canvas'),VEHICLES[i])));}
function showVehicles(){show('scrVehicles');setMode('vehicles');buildVehicles();}
function toMenu(){cur=0;G=newGame(0);progText();show('scrMenu');setMode('menu');}
function buildLevels(){
  const box=$('#lvList');box.innerHTML='';
  for(const ch of [1,2,3]){
    const sec=document.createElement('div');sec.className='chapter';sec.innerHTML=`<h3>${CHAPTERS[ch]}</h3>`;
    const grid=document.createElement('div');grid.className='grid';
    LEVELS.forEach((L,i)=>{if(L.chapter!==ch)return;const b=document.createElement('button');b.className='lv c'+ch;
      b.innerHTML=`<b>${L.id}</b><span>${L.name}</span>${cleared.has(L.id)?'<i class="done" aria-label="已過關">✓</i>':''}`;
      b.onclick=()=>loadLevel(i);grid.appendChild(b);});
    sec.appendChild(grid);box.appendChild(sec);
  }
}
function showLevels(){buildLevels();show('scrLevels');setMode('levels');}
function loadLevel(i,direct){
  cur=i;G=newGame(i);const L=G.L;
  $('#hId').textContent=L.id;$('#hName').textContent=L.name;$('#hGoal').textContent=L.goal;
  if(direct){startPlay();return;}
  $('#iChap').textContent=CHAPTERS[L.chapter];$('#iId').textContent=L.id;$('#iName').textContent=L.name;$('#iGoal').textContent=L.goal;
  $('#iRules').innerHTML=L.rules.map(r=>`<li>${r}</li>`).join('')+'<li>任何時候換車道都要先打方向燈，否則失敗</li>';
  $('#iVeh').textContent=`駕駛車輛：${VEHICLES[vehIdx].name}（可在主選單更換）`;
  show('scrIntro');setMode('intro');
}
function startPlay(){show(null);setMode('play');if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();}
function retry(){loadLevel(cur,true);}
function pause(){if(mode!=='play')return;show('scrPause');setMode('pause');}
function resume(){show(null);setMode('play');document.activeElement&&document.activeElement.blur&&document.activeElement.blur();}
function quit(){show('scrBye');setMode('bye');try{window.close();}catch(e){}}
function endLevel(g){
  setMode('ended');
  if(g.over==='win'){cleared.add(g.L.id);saveProg();}
  setTimeout(()=>{if(G!==g)return;showResult(g);},650);
}
function showResult(g){
  const win=g.over==='win',last=cur===LEVELS.length-1;
  $('#rCard').className='card result '+(win?'win':'fail');
  $('#rLv').textContent=`${g.L.id}　${g.L.name}`;
  $('#rTitle').textContent=win?(last?'全部通關！':'過關！'):'失敗';
  $('#rMsg').textContent=(win?'':'失敗原因：')+g.msg;
  const btns=[];
  if(win&&!last)btns.push(['下一關','next','']);
  btns.push(['再試一次','retry',win&&!last?'plain':'']);
  btns.push(['選擇關卡','levels','plain']);btns.push(['主選單','menu','plain']);
  $('#rBtns').innerHTML=btns.map(([t,a,c])=>`<button class="btn center ${c}" data-act="${a}">${t}</button>`).join('');
  show('scrResult');setMode('result');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='restart')loadLevel(0);
  else if(a==='levels')showLevels();
  else if(a==='vehicles')showVehicles();
  else if(a==='quit')quit();
  else if(a==='menu')toMenu();
  else if(a==='resume')resume();
  else if(a==='retry')retry();
  else if(a==='next')loadLevel(Math.min(cur+1,LEVELS.length-1));
});
$('#btnStart').onclick=startPlay;
$('#btnPause').onclick=pause;

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(mode==='play'&&G&&!G.over){for(let i=0;i<2&&!G.over;i++)step(G,dt/2);}
  if(G){updateCam(G,dt);render(G);if(mode==='play'||mode==='ended'||mode==='pause')updateHud(G);}
  requestAnimationFrame(loop);
}
toMenu();
requestAnimationFrame(loop);
})();
</script>
